schema_version = "1.4"

[task]
name = "eclipse/$name"
version = "2.1.0"
description = "$description"
authors = [{ name = "Eclipse Laboratories", email = "daniel@eclipse.builders" }]
keywords = ["smart-contracts", "solidity", "foundry", "security", "$format"]

[metadata]
format = "$format"
auditor = "$auditor"
audit_title = "$audit_title"
audit_date = "$audit_date"
source_repository = "https://github.com/Eclipse-Laboratories-Inc/syzygy"
source_commit = "$syzygy_commit"
$programs_commit
graded_keys = [$keys]
source_license = "Proprietary - Eclipse Laboratories, Inc. (authorized evaluation distribution)"

[verifier]
timeout_sec = 1200.0
user = "root"
$verifier

[agent]
timeout_sec = 3600.0
user = "foundry"

[environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 8192
storage_mb = 20480
workdir = "/app"
