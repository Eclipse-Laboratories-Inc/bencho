schema_version = "1.4"

[task]
name = "eclipse/report-ottersec-2024-07"
version = "2.0.0"
description = "Audit the Eclipse bridge code that OtterSec audited on 2024-07-18 and write a report."
authors = [{ name = "Eclipse Laboratories", email = "daniel@eclipse.builders" }]
keywords = ["smart-contracts", "solidity", "foundry", "security", "report"]

[metadata]
format = "report"
auditor = "OtterSec"
audit_title = "Eclipse Canonical Bridge Audit"
audit_date = "2024-07-18"
source_repository = "https://github.com/Eclipse-Laboratories-Inc/syzygy"
source_commit = "fd6b81b965bb99c03565c48dde5a0b6125e67f78"
eclipse_programs_commit = "a8a06e095f86dd92ad103010b11bfdfa80424e0a"
graded_keys = ["ottersec-2024-07/OS-ECB-ADV-00", "ottersec-2024-07/OS-ECB-ADV-01", "ottersec-2024-07/OS-ECB-ADV-02", "ottersec-2024-07/OS-ECB-SUG-00", "ottersec-2024-07/OS-ECB-SUG-01.1", "ottersec-2024-07/OS-ECB-SUG-01.2", "ottersec-2024-07/OS-ECB-SUG-01.3", "ottersec-2024-07/OS-ECB-SUG-01.4", "ottersec-2024-07/OS-ECB-SUG-02.1", "ottersec-2024-07/OS-ECB-SUG-02.2"]
source_license = "Proprietary - Eclipse Laboratories, Inc. (authorized evaluation distribution)"

[verifier]
timeout_sec = 1200.0
user = "root"
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com"]

[verifier.env]
JUDGE_API_KEY = "${JUDGE_API_KEY}"
JUDGE_MODEL = "${JUDGE_MODEL:-claude-opus-5-5}"
JUDGE_WORKSPACE_ID = "${JUDGE_WORKSPACE_ID:-}"

[agent]
timeout_sec = 3600.0
user = "foundry"

[environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 8192
storage_mb = 20480
workdir = "/app"
