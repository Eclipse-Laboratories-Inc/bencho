[package]
name = "canonical_bridge"
version = "0.1.1"
description = "Created with Anchor"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "canonical_bridge"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.29.0"
anchor-spl = "0.29.0"
solana-program = "1.18.1"
alloy-rlp = { version = "0.3.4", features = ["derive"] }
base64 = "0.21.7"
