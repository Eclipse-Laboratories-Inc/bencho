schema_version = "1.4"

[task]
name = "eclipse/report-ottersec-2024-10"
version = "2.1.0"
description = "Audit the Eclipse bridge code that OtterSec audited on 2024-10-31 and write a report."
authors = [{ name = "Eclipse Laboratories", email = "daniel@eclipse.builders" }]
keywords = ["smart-contracts", "solidity", "foundry", "security", "report"]

[metadata]
format = "report"
auditor = "OtterSec"
audit_title = "Eclipse-syzygy Audit"
audit_date = "2024-10-31"
source_repository = "https://github.com/Eclipse-Laboratories-Inc/syzygy"
source_commit = "b631617168edce3171738d677536a4b1cf877f8f"

graded_keys = ["ottersec-2024-10/OS-ECS-SUG-00.1", "ottersec-2024-10/OS-ECS-SUG-00.2", "ottersec-2024-10/OS-ECS-SUG-00.3", "ottersec-2024-10/OS-ECS-SUG-01.1", "ottersec-2024-10/OS-ECS-SUG-01.2", "ottersec-2024-10/OS-ECS-SUG-01.3"]
source_license = "Proprietary - Eclipse Laboratories, Inc. (authorized evaluation distribution)"

[verifier]
timeout_sec = 1200.0
user = "root"
network_mode = "allowlist"
allowed_hosts = [
  "api.anthropic.com",
  "api.openai.com",
  "api.deepseek.com",
  "api.moonshot.ai",
  "api.moonshot.cn",
  "openrouter.ai",
  "api.together.xyz",
  "api.fireworks.ai",
]

[verifier.env]
JUDGE_API_KEY = "${JUDGE_API_KEY}"
JUDGE_MODEL = "${JUDGE_MODEL:-claude-opus-5-5}"
JUDGE_API = "${JUDGE_API:-}"
JUDGE_BASE_URL = "${JUDGE_BASE_URL:-}"
JUDGE_WORKSPACE_ID = "${JUDGE_WORKSPACE_ID:-}"

[agent]
timeout_sec = 3600.0
user = "foundry"

[environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 8192
storage_mb = 20480
workdir = "/app"
