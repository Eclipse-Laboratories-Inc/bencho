# Overlay on SWE-agent config/default.yaml. The container image has forge.
# The user key is not scoped to one workspace, so every request names Default.
env:
  deployment:
    type: docker
    image: eclipse-rl-pilot:foundry
    python_standalone_dir: null
    pull: never
agent:
  model:
    temperature: 0.5
    top_p: null
  templates:
    instance_template: |-
      <uploaded_files>
      {{working_dir}}
      </uploaded_files>
      I've uploaded a repository in the directory {{working_dir}}. The smart contracts are Foundry projects under smart-contracts/. `forge` is on PATH. Run it from smart-contracts/.

      Consider the following issue:

      <pr_description>
      {{problem_statement}}
      </pr_description>

      Make the minimal source change so the issue is fixed. Do not modify unrelated behavior.
      Follow these steps:
      1. Find and read the code relevant to the issue.
      2. Reproduce it with `forge test` from smart-contracts/, or with a temporary Forge test. Delete any temporary test before you submit.
      3. Edit non-test source so the issue is fixed.
      4. Rerun the reproduction and confirm it passes.
      5. Check that existing unit tests you did not write still pass.
      Your thinking should be thorough.
