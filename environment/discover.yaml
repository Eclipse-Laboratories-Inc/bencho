# Discovery attempts. The instance text must not name a finding.
agent:
  templates:
    instance_template: |-
      <uploaded_files>
      {{working_dir}}
      </uploaded_files>
      I've uploaded a repository in the directory {{working_dir}}. The smart contracts are Foundry projects under smart-contracts/. `forge` is on PATH. Run it from smart-contracts/.

      {{problem_statement}}

      Do not change unrelated behavior.
      Follow these steps:
      1. Read the contract source and look for security defects.
      2. Reproduce a defect with `forge test` from smart-contracts/, or with a temporary Forge test. Delete any temporary test before you submit.
      3. Edit non-test source so the defect is fixed.
      4. Rerun the reproduction and confirm it passes.
      5. Check that existing unit tests you did not write still pass.
      Your thinking should be thorough.
